name: 'eth_dbt_cert_prep'
version: '1.0.0'

profile: 'eth_dbt_cert_prep'

flags:
  fail_fast: true

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  eth_dbt_cert_prep:
    +materialized: table
    +tags: ["eth", "crypto"]
    marts:
      +tags:
        - powerbi
        - report
      stablecoin_activity_per_day:
        +post-hook:
            - GRANT USAGE ON DATABASE DBT TO ROLE TESTER;
            - GRANT USAGE ON SCHEMA DBT.DBT_AZIZ TO ROLE TESTER;

vars:
  token_address_var: '0x50327c6c5a14dcade707abad2e27eb517df87ab5'
  token_decimals_var: '6'

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['eth_dbt_cert_prep', 'dbt_utils']
